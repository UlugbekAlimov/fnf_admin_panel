<section class="rounded-2xl border border-slate-200 bg-white p-6 shadow-sm">
  <div class="flex flex-wrap items-center justify-between gap-4">
    <div class="text-sm font-semibold text-slate-500">
      Editing: <span class="text-slate-800">2.1 Understanding Personas</span>
    </div>
    <div class="flex items-center gap-2 rounded-xl bg-emerald-50 p-1 text-sm">
      <button
        type="button"
        class="flex items-center gap-2 rounded-lg bg-white px-3 py-2 text-slate-700 shadow-sm"
      >
        <i class="pi pi-video text-sm"></i>
        <span>Video</span>
      </button>
      <button type="button" class="flex items-center gap-2 rounded-lg px-3 py-2 text-slate-500">
        <i class="pi pi-file-edit text-sm"></i>
        <span>Text</span>
      </button>
      <button type="button" class="flex items-center gap-2 rounded-lg px-3 py-2 text-slate-500">
        <i class="pi pi-check-square text-sm"></i>
        <span>Quiz</span>
      </button>
      <button type="button" class="flex items-center gap-2 rounded-lg px-3 py-2 text-slate-500">
        <i class="pi pi-circle text-sm"></i>
        <span>Live</span>
      </button>
    </div>
  </div>

  <div class="mt-6 space-y-6">
    <div class="space-y-2">
      <label class="text-xs block font-semibold uppercase tracking-wide text-slate-500"
        >Lesson Title</label
      >
      <input type="text" class="w-full" pInputText placeholder="Understanding Personas" />
    </div>

    <div class="space-y-2">
      <label class="text-xs font-semibold uppercase tracking-wide text-slate-500"
        >Video Source</label
      >
      <p-fileupload
        name="demo[]"
        url="https://www.primefaces.org/cdn/api/upload.php"
        [multiple]="true"
        accept="image/*"
        mode="advanced"
      >
        <ng-template #empty>
          <div>Drag and drop files to here to upload.</div>
        </ng-template>
      </p-fileupload>
    </div>

    <div class="space-y-2">
      <p class="text-xs font-semibold uppercase tracking-wide text-slate-500">
        Lesson Content / Notes
      </p>
      <p-editor [style]="{ height: '320px' }" />
    </div>
  </div>
</section>
