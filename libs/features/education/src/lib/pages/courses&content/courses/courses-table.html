<div>
  <div class="flex justify-between">
    <h1>Courses</h1>
    <p-button
      icon="pi pi-plus"
      class="emerald-btn"
      (click)="openCreate()"
      label="Create Course"
    />
  </div>
  <div class="flex justify-between">
    <div class="mt-5 space-x-2">
      <input
        class=""
        pInputText
        [(ngModel)]="searchTerm"
        type="text"
        placeholder="Search company"
      />
      <p-select
        icon="pi pi-upload"
        [options]="plans"
        [(ngModel)]="selectedPlan"
        optionLabel="name"
        placeholder="Plans"
      >
      </p-select>
      <p-select
        [options]="cities"
        [(ngModel)]="selectedCity"
        optionLabel="name"
        placeholder="Select a City"
      />
    </div>
    <div class="mt-5">
      <p-datepicker
        [(ngModel)]="dates"
        [showButtonBar]="true"
        placeholder="Customized"
        selectionMode="range"
        [readonlyInput]="true"
      >
        <ng-template #buttonbar let-todayCallback="todayCallback" let-clearCallback="clearCallback">
          <div class="flex justify-between w-full">
            <div class="flex gap-2">
              <p-button size="small" label="Exact" severity="secondary" />
              <p-button size="small" label="Flexible" severity="secondary" />
            </div>
            <div class="flex gap-2">
              <p-button
                size="small"
                label="Today"
                (click)="todayCallback($event)"
                variant="outlined"
              />
              <p-button
                size="small"
                icon="pi pi-times"
                severity="danger"
                variant="text"
                (click)="clearCallback($event)"
              />
            </div>
          </div>
        </ng-template>
      </p-datepicker>
    </div>
  </div>
  <div class="mt-5">
    <ui-table
      [value]="products"
      [columns]="tableColumns"
      [totalRecords]="totalRecords"
      [rowsPerPageOptions]="rowsPerPageOptions"
      [showIndex]="true"
      [showPhoto]="true"
      [subTextFieldMap]="{ name: 'slug' }"
      photoField="logo"
      photoAltField="name"
      photoHeader="Logo"
      [chipFields]="chipFields"
      [chipVariantFieldMap]="chipVariantFieldMap"
      actionsHeader=""
      actionsColWidth="3.5rem"
    >
      <ng-template #actions let-row>
        <div class="flex items-center gap-2 justify-center">
          <button (click)="detail(row)">
            <i class="cursor-pointer text-green-500 pi pi-eye"></i>
          </button>
          <button (click)="edit(row)">
            <i class="cursor-pointer text-amber-500 pi pi-pencil"></i>
          </button>
          <button (click)="remove(row)">
            <i class="cursor-pointer text-red-500 pi pi-trash"></i>
          </button>
        </div>
      </ng-template>
    </ui-table>
  </div>
</div>

<courses-table
  [(visible)]="showDialog"
  [editingCourse]="editingCourse"
  (create)="createCourse($event)"
  (update)="updateCourse($event)"
></courses-table>

<p-dialog
  header="Delete course"
  [modal]="true"
  [(visible)]="showDeleteDialog"
  (onHide)="closeDeleteDialog()"
  [style]="{ width: '28rem' }"
>
  <p class="text-sm text-slate-500 mb-6">
    Delete <span class="font-semibold text-slate-900">{{ selectedCompany?.name || 'this course' }}</span>?
    This action cannot be undone.
  </p>
  <div class="flex justify-end gap-2">
    <p-button label="Cancel" severity="secondary" (click)="closeDeleteDialog()"></p-button>
    <p-button label="Delete" severity="danger" (click)="confirmDelete()"></p-button>
  </div>
</p-dialog>
