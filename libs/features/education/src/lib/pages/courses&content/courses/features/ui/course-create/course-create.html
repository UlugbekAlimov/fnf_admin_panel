<p-dialog
  header="Create company"
  [modal]="true"
  [visible]="visible"
  (visibleChange)="visibleChange.emit($event)"
  [style]="{ width: '30rem' }"
>
  <span class="p-text-secondary block mb-6">Add information about your company</span>

  <div class="space-y-6">
    <div>
      <div class="grid gap-4 md:grid-cols-2">
        <div class="space-y-2">
          <label class="block text-xs font-semibold text-slate-500">Course title *</label>
          <input type="text" pInputText placeholder="Enter title" />
        </div>
        <div class="space-y-2">
          <label class="block text-xs font-semibold text-slate-500">Slug *</label>
          <input type="text" pInputText placeholder="course-slug" />
        </div>
        <div class="space-y-2">
          <label class="block text-xs font-semibold text-slate-500">Level</label>
          <p-select
            [options]=""
            optionLabel="name"
            placeholder="Select a level"
            class="w-full max-w-[208px]"
          />
        </div>
        <div class="space-y-2">
          <label class="block text-xs font-semibold text-slate-500">Language</label>
          <p-select
            [options]=""
            optionLabel="name"
            placeholder="Select a language"
            class="w-full max-w-[208px]"
          />
        </div>
        <div class="space-y-2">
          <label class="block text-xs font-semibold text-slate-500">Description</label>
          <textarea rows="5" cols="53" pTextarea [(ngModel)]="value"></textarea>
        </div>
      </div>
    </div>
  </div>

  <div class="mt-8 flex justify-end gap-2">
    <p-button label="Cancel" severity="secondary" (click)="close()" />
    <p-button label="Create" (click)="close()" />
  </div>
</p-dialog>
