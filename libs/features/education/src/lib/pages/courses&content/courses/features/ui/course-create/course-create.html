<p-dialog
  [header]="isEditMode ? 'Edit course' : 'Create course'"
  [modal]="true"
  [visible]="visible"
  (visibleChange)="handleVisibleChange($event)"
  [style]="{ width: '34rem' }"
>
  <span class="p-text-secondary block mb-6">
    {{ isEditMode ? 'Update course information.' : 'Add information about the course.' }}
  </span>

  <div class="space-y-6">
    <div>
      <div class="grid gap-4 md:grid-cols-2">
        <div class="space-y-2">
          <label class="block text-xs font-semibold text-slate-500">Course title *</label>
          <input type="text" pInputText placeholder="Enter title" [(ngModel)]="title" />
        </div>
        <div class="space-y-2">
          <label class="block text-xs font-semibold text-slate-500">Slug *</label>
          <input type="text" pInputText placeholder="course-slug" [(ngModel)]="slug" />
        </div>
        <div class="space-y-2">
          <label class="block text-xs font-semibold text-slate-500">Level</label>
          <p-select
            [options]="levels"
            optionLabel="name"
            [(ngModel)]="level"
            placeholder="Select a level"
            class="w-full max-w-[208px]"
          />
        </div>
        <div class="space-y-2">
          <label class="block text-xs font-semibold text-slate-500">Language</label>
          <p-select
            [options]="languages"
            optionLabel="name"
            [(ngModel)]="language"
            placeholder="Select a language"
            class="w-full max-w-[208px]"
          />
        </div>
        <div class="space-y-2">
          <label class="block text-xs font-semibold text-slate-500">Status</label>
          <p-select
            [options]="statuses"
            optionLabel="name"
            [(ngModel)]="status"
            placeholder="Select a status"
            class="w-full max-w-[208px]"
          />
        </div>
        <div class="space-y-2">
          <label class="block text-xs font-semibold text-slate-500">Students</label>
          <input type="number" min="0" pInputText [(ngModel)]="students" />
        </div>
        <div class="space-y-2 md:col-span-2">
          <label class="block text-xs font-semibold text-slate-500">Description</label>
          <textarea rows="4" pTextarea [(ngModel)]="description"></textarea>
        </div>
      </div>
    </div>
  </div>

  <div class="mt-8 flex justify-end gap-2">
    <p-button label="Cancel" severity="secondary" (click)="close()" />
    <p-button [label]="isEditMode ? 'Save' : 'Create'" (click)="submit()" />
  </div>
</p-dialog>
