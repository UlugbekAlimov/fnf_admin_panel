<p-dialog
  [header]="isEditMode ? 'Edit group' : 'Create group'"
  [modal]="true"
  [visible]="visible"
  (visibleChange)="handleVisibleChange($event)"
  [style]="{ width: '34rem' }"
>
  <span class="p-text-secondary block mb-6">
    {{ isEditMode ? 'Update group information.' : 'Add information about the group.' }}
  </span>

  <div class="space-y-6">
    <div class="grid gap-4 md:grid-cols-2">
      <div class="space-y-2">
        <label class="block text-xs font-semibold text-slate-500">Group name *</label>
        <input type="text" pInputText placeholder="Enter name" [(ngModel)]="name" />
      </div>
      <div class="space-y-2">
        <label class="block text-xs font-semibold text-slate-500">Slug *</label>
        <input type="text" pInputText placeholder="group-slug" [(ngModel)]="slug" />
      </div>
      <div class="space-y-2">
        <label class="block text-xs font-semibold text-slate-500">Language</label>
        <p-select
          [options]="cities"
          optionLabel="name"
          [(ngModel)]="city"
          placeholder="Select a language"
          class="w-full max-w-[208px]"
        />
      </div>
      <div class="space-y-2">
        <label class="block text-xs font-semibold text-slate-500">Students</label>
        <p-select
          [options]="plans"
          optionLabel="name"
          [(ngModel)]="plan"
          placeholder="Select students"
          class="w-full max-w-[208px]"
        />
      </div>
      <div class="space-y-2">
        <label class="block text-xs font-semibold text-slate-500">Status</label>
        <p-select
          [options]="statuses"
          optionLabel="name"
          [(ngModel)]="status"
          placeholder="Select a status"
          class="w-full max-w-[208px]"
        />
      </div>
    </div>
  </div>

  <div class="mt-8 flex justify-end gap-2">
    <p-button label="Cancel" severity="secondary" (click)="close()" />
    <p-button [label]="isEditMode ? 'Save' : 'Create'" (click)="submit()" />
  </div>
</p-dialog>
