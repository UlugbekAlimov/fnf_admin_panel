<div>
  <div class="flex items-center justify-between">
    <h1>Tests</h1>
    <div class="flex items-center gap-2">
      <p-button
        icon="pi pi-question-circle"
        severity="secondary"
        label="Add Test"
        (onClick)="openQuestionDialog()"
      />
      <p-button
        icon="pi pi-plus"
        class="emerald-btn"
        label="Create Question"
        (onClick)="openDialog()"
      />
    </div>
  </div>

  <div class="mt-4">
    <p-select
      [options]="viewOptions"
      optionLabel="name"
      [(ngModel)]="selectedView"
      placeholder="Select view"
      class="w-56"
    ></p-select>
  </div>

  <div class="mt-5">
    <ui-table
      [value]="tableRows"
      [columns]="tableColumns"
      [totalRecords]="totalRecords"
      [rows]="10"
      [first]="0"
      [rowsPerPageOptions]="[10, 20, 30]"
      [loading]="isQuestionsView ? questionStore.loading() : store.loading()"
      [showIndex]="true"
      [chipFields]="chipFields"
      [chipVariantFieldMap]="chipVariantFieldMap"
    >
    </ui-table>
  </div>
</div>

<education-question-create [(visible)]="showQuestionDialog" (create)="addQuestion($event)"></education-question-create>
<education-test-create [(visible)]="showDialog" (create)="addTest($event)"></education-test-create>
