<div>
  <div class="flex justify-between">
    <h1>Companies</h1>
    <p-button
      icon="pi pi-plus"
      class="emerald-btn"
      (onClick)="showDialog = true"
      label="Create Company"
    />
  </div>
  <div class="flex justify-between">
    <div class="mt-5 space-x-2">
      <input
        class=""
        pInputText
        [(ngModel)]="searchTerm"
        type="text"
        placeholder="Search company"
      />
      <p-select
        icon="pi pi-upload"
        [options]="plans"
        [(ngModel)]="selectedPlan"
        optionLabel="name"
        placeholder="Plans"
      >
      </p-select>
      <p-select
        [options]="cities"
        [(ngModel)]="selectedCity"
        optionLabel="name"
        placeholder="Select a City"
      />
    </div>
    <div class="mt-5 space-x-2">
      <p-datepicker
        [(ngModel)]="dates"
        [showButtonBar]="true"
        placeholder="Customized"
        selectionMode="range"
        [readonlyInput]="true"
      >
        <ng-template #buttonbar let-todayCallback="todayCallback" let-clearCallback="clearCallback">
          <div class="flex justify-between w-full">
            <div class="flex gap-2">
              <p-button size="small" label="Exact" severity="secondary" />
              <p-button size="small" label="Flexible" severity="secondary" />
            </div>
            <div class="flex gap-2">
              <p-button
                size="small"
                label="Today"
                (click)="todayCallback($event)"
                variant="outlined"
              />
              <p-button
                size="small"
                icon="pi pi-times"
                severity="danger"
                variant="text"
                (click)="clearCallback($event)"
              />
            </div>
          </div>
        </ng-template>
      </p-datepicker>
      <p-button
        icon="pi pi-refresh"
        class="emerald-btn"
        (onClick)="onRefresh()"
        label="Refresh"
      />
    </div>
  </div>
  <div class="mt-5">
    <ui-table
      [value]="filteredProducts"
      [columns]="tableColumns"
      [totalRecords]="totalRecords"
      [rows]="pageSize"
      [first]="(currentPage - 1) * pageSize"
      [rowsPerPageOptions]="rowsPerPageOptions"
      [loading]="loading"
      [showIndex]="true"
      [showPhoto]="true"
      photoField="logo"
      photoAltField="name"
      photoHeader="Logo"
      [subTextFieldMap]="{ name: 'slug' }"
      [chipFields]="chipFields"
      [chipVariantFieldMap]="chipVariantFieldMap"
      actionsHeader=""
      actionsColWidth="3.5rem"
      (pageChange)="onPageChange($event)"
    >
      <ng-template #actions let-row>
        <div class="flex items-center gap-2 justify-center">
          <button (click)="detail(row)">
            <i class="cursor-pointer text-green-500 pi pi-eye"></i>
          </button>
          <button (click)="edit(row)">
            <i class="cursor-pointer text-amber-500 pi pi-pencil"></i>
          </button>
          <button (click)="remove(row)">
            <i class="cursor-pointer text-red-500 pi pi-trash"></i>
          </button>
        </div>
      </ng-template>
    </ui-table>
  </div>

  <companies-create [(visible)]="showDialog"></companies-create>
  <company-edit
    [(visible)]="showEditDialog"
    [company]="selectedCompany"
    (save)="updateCompany($event)"
  ></company-edit>
  <company-delete
    [(visible)]="showDeleteDialog"
    [company]="selectedCompany"
    (confirm)="confirmDelete($event)"
  ></company-delete>

  <company-detail
    [(visible)]="showDetailDrawer"
    [companyId]="selectedCompanyId"
  ></company-detail>
</div>
