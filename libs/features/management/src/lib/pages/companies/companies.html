<div>
  <div class="flex justify-between">
    <h1>Companies</h1>
    <p-button icon="pi pi-plus" class="emerald-btn" label="Create Company" />
  </div>
  <div class="flex justify-between">

      <div class="mt-5 space-x-2">
        <input
          class=""
          pInputText
          [(ngModel)]="value2"
          type="text"
          placeholder="Search company"
        />
        <p-select icon="pi pi-upload" optionLabel="name" placeholder="Plans"> </p-select>
        <p-select optionLabel="name" placeholder="Select a City" />
      </div>
      <div class="mt-5">
        <p-datepicker
          [(ngModel)]="dates"
          [showButtonBar]="true"
          placeholder="Customized"
          selectionMode="range"
          [readonlyInput]="true"
        >
          <ng-template #buttonbar let-todayCallback="todayCallback" let-clearCallback="clearCallback">
            <div class="flex justify-between w-full">
              <div class="flex gap-2">
                <p-button size="small" label="Exact" severity="secondary" />
                <p-button size="small" label="Flexible" severity="secondary" />
              </div>
              <div class="flex gap-2">
                <p-button
                  size="small"
                  label="Today"
                  (click)="todayCallback($event)"
                  variant="outlined"
                />
                <p-button
                  size="small"
                  icon="pi pi-times"
                  severity="danger"
                  variant="text"
                  (click)="clearCallback($event)"
                />
              </div>
            </div>
          </ng-template>
        </p-datepicker>
      </div>
  </div>
  <div class="mt-5">
      <company-table></company-table>
  </div>
</div>
