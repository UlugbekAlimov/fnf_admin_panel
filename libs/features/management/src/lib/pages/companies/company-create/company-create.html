<p-dialog
  header="Create company"
  [modal]="true"
  [visible]="visible"
  (visibleChange)="visibleChange.emit($event)"
  [style]="{ width: '30rem' }"
>
  <span class="p-text-secondary block mb-6">Add information about your company</span>

  <div class="space-y-6">
    <div>
      <div class="grid gap-4 md:grid-cols-2">
        <div class="space-y-2">
          <label class="block text-xs font-semibold text-slate-500">Name *</label>
          <input type="text" pInputText [(ngModel)]="name" placeholder="Company name" />
        </div>
        <div class="space-y-2">
          <label class="block text-xs font-semibold text-slate-500">Slug *</label>
          <input type="text" pInputText [(ngModel)]="slug" placeholder="company-slug" />
        </div>
        <div class="space-y-2">
          <label class="block text-xs font-semibold text-slate-500">Legal name</label>
          <input type="text" pInputText [(ngModel)]="legalName" placeholder="Legal entity name" />
        </div>
        <div class="space-y-2">
          <label class="block text-xs font-semibold text-slate-500">Country</label>
          <p-select
            [options]="countries"
            [(ngModel)]="country"
            optionLabel="name"
            placeholder="Select a Country"
            class="w-full max-w-[208px]"
          />
        </div>
        <div class="space-y-2">
          <label class="block text-xs font-semibold text-slate-500">Timezone</label>
          <input type="text" pInputText [(ngModel)]="timezone" placeholder="Asia/Dushanbe" />
        </div>
        <div class="space-y-2">
          <label class="block text-xs font-semibold text-slate-500">Default locale</label>
          <input type="text" pInputText [(ngModel)]="locale" placeholder="en" />
        </div>
      </div>
    </div>

    <div>
      <p class="text-xs font-semibold uppercase tracking-[0.18em] text-slate-400 mb-3">Branding</p>
      <div class="grid gap-4 md:grid-cols-2">
        <div class="space-y-2">
          <label class="block text-xs font-semibold text-slate-500">Logo URL</label>
          <input type="text" pInputText [(ngModel)]="logoUrl" placeholder="https://..." />
        </div>
        <div class="space-y-2">
          <p class="block text-xs font-semibold text-slate-500">
            Status
          </p>
          <p-select
            [options]="statuses"
            [(ngModel)]="status"
            optionLabel="name"
            placeholder="Select status"
            class="w-full"
          />
        </div>
        <div class="space-y-2">
          <label class="block text-xs font-semibold text-center text-slate-500"
            >Primary color</label
          >
          <div class="flex justify-center items-center gap-3">
            <p-colorpicker [(ngModel)]="primaryColor" inputId="cp-primary" />
            <span class="text-sm text-slate-600">{{ primaryColor }}</span>
          </div>
        </div>
        <div class="space-y-2">
          <label class="block text-xs font-semibold text-slate-500">Secondary color</label>
          <div class="flex items-center gap-3">
            <p-colorpicker [(ngModel)]="secondaryColor" inputId="cp-secondary" />
            <span class="text-sm text-slate-600">{{ secondaryColor }}</span>
          </div>
        </div>
      </div>
    </div>

    <div></div>
  </div>

  <div class="mt-8 flex justify-end gap-2">
    <p-button label="Cancel" severity="secondary" (click)="close()" />
    <p-button label="Confirm" (click)="close()" />
  </div>
</p-dialog>
