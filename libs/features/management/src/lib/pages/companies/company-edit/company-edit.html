<p-dialog header="Edit company" [modal]="true" [(visible)]="visible" [style]="{ width: '32rem' }">
  <p class="text-sm text-slate-500 mb-4">Update the company details.</p>

  <div class="space-y-4">
    <div class="grid gap-4 md:grid-cols-2">
      <div class="space-y-2">
        <label class="block text-xs font-semibold text-slate-500">Company name *</label>
        <input type="text" pInputText [(ngModel)]="editName" placeholder="Company name" />
      </div>
      <div class="space-y-2">
        <label class="block text-xs font-semibold text-slate-500">Label</label>
        <input type="text" pInputText [(ngModel)]="editLabel" placeholder="Enterprise" />
      </div>
    </div>
    <div class="grid gap-4 md:grid-cols-2">
      <div class="space-y-2">
        <label class="block text-xs font-semibold text-slate-500">Country</label>
        <p-select
          [options]="countries"
          [(ngModel)]="editCountry"
          optionLabel="name"
          placeholder="Select a Country"
        />
      </div>
      <div class="space-y-2">
        <label class="block text-xs font-semibold text-slate-500">Status</label>
        <p-select
          [options]="statuses"
          [(ngModel)]="editStatus"
          optionLabel="name"
          placeholder="Select status"
        />
      </div>
    </div>
  </div>

  <div class="mt-6 flex justify-end gap-2">
    <p-button label="Cancel" severity="secondary" (click)="close()" />
    <p-button label="Save" (click)="submit()" />
  </div>
</p-dialog>
