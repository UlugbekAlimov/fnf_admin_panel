<p-dialog
  [header]="editingCompany ? 'Edit company' : 'Create company'"
  [modal]="true"
  [visible]="visible"
  (visibleChange)="visibleChange.emit($event)"
  [style]="{ width: '30rem' }"
>
  <div class="space-y-6">
    <div class="grid gap-4 md:grid-cols-2">
      <div class="space-y-2">
        <label class="block text-xs font-semibold text-slate-500">Name *</label>
        <input type="text" pInputText [(ngModel)]="name" />
      </div>

      <div class="space-y-2">
        <label class="block text-xs font-semibold text-slate-500">Country</label>
        <p-autocomplete
          [(ngModel)]="country"
          [suggestions]="filteredCountries"
          (completeMethod)="search($event)"
          optionLabel="name"
        />
      </div>

      <div class="space-y-2" *ngIf="!editingCompany">
        <label class="block text-xs font-semibold text-slate-500">Slug *</label>
        <input type="text" pInputText [(ngModel)]="slug" />
      </div>

      <div class="space-y-2">
        <label class="block text-xs font-semibold text-slate-500">Timezone</label>
        <input type="text" pInputText [(ngModel)]="timezone" placeholder="Asia/Dushanbe" />
      </div>

      <div class="space-y-2" *ngIf="editingCompany">
        <label class="block text-xs font-semibold text-slate-500">Legal name</label>
        <input type="text" pInputText [(ngModel)]="legal_name" />
      </div>

      <div class="space-y-2" *ngIf="editingCompany">
        <label class="block text-xs font-semibold text-slate-500">Default locale</label>
        <p-autocomplete
          [(ngModel)]="defaultLocale"
          [suggestions]="filteredLanguages"
          (completeMethod)="searchLanguage($event)"
          optionLabel="name"
          placeholder="English"
        />
      </div>

      <div class="space-y-2" *ngIf="editingCompany">
        <label class="block text-xs font-semibold text-slate-500">Status</label>
        <p-select [(ngModel)]="status" [options]="statusOptions" class="w-full" placeholder="Select status" />
      </div>
    </div>

    <small *ngIf="store.createError()" class="text-red-500">{{ store.createError() }}</small>
  </div>

  <div class="mt-8 flex justify-end gap-2">
    <p-button
      label="Cancel"
      severity="secondary"
      (onClick)="close()"
      [disabled]="store.creating()"
    />
    <p-button
      [label]="editingCompany ? 'Save' : 'Confirm'"
      (onClick)="submit()"
      [disabled]="store.creating()"
    />
  </div>
</p-dialog>
