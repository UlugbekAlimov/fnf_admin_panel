<div>
  <div class="flex items-center justify-end my-6">
    <p-button icon="pi pi-plus" class="emerald-btn" label="Create role" (click)="openDialog()" />
  </div>

  <div class="grid gap-4 md:grid-cols-2">
    <div
      *ngFor="let role of roles"
      class="rounded-lg border border-slate-200 bg-white p-5 shadow-sm"
    >
      <div class="flex items-start justify-between gap-4">
        <div>
          <h2 class="text-base font-semibold text-slate-900">{{ role.name }}</h2>
          <p class="mt-2 text-sm text-slate-500">{{ role.description || 'No description yet.' }}</p>
        </div>
        <div class="text-right">
          <p class="text-xs uppercase tracking-wide text-slate-400">Users</p>
          <p class="text-lg mt-2 font-semibold text-slate-900"><i class="pi pi-user mr-2"></i>{{ role.usersCount }}</p>
        </div>
      </div>
    </div>
  </div>
</div>

<p-dialog header="Create role" [modal]="true" [(visible)]="showDialog" [style]="{ width: '25rem' }">
  <p class="text-sm text-slate-500 mb-4">Add a new role and its permissions summary.</p>

  <div class="space-y-4">
    <div class="space-y-2">
      <label class="block text-xs font-semibold text-slate-500">Role name *</label>
      <input
        class="w-full"
        type="text"
        pInputText
        [(ngModel)]="newRoleName"
        placeholder="Role name"
      />
    </div>
    <div class="space-y-2">
      <label class="block text-xs font-semibold text-slate-500">Description</label>
      <textarea
        rows="3"
        class="w-full rounded border border-slate-300 p-2 text-sm"
        [(ngModel)]="newRoleDescription"
        placeholder="What can this role do?"
      ></textarea>
    </div>
  </div>

  <div class="mt-6 flex justify-end gap-2">
    <p-button label="Cancel" severity="secondary" (click)="closeDialog()" />
    <p-button label="Create" (click)="createRole()" [disabled]="!newRoleName.trim()" />
  </div>
</p-dialog>
