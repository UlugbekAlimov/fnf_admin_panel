<p-dialog header="Delete user" [modal]="true" [(visible)]="visible" [style]="{ width: '28rem' }">
  <p class="text-sm text-slate-500 mb-6">
    Delete <span class="font-semibold text-slate-900">{{ user?.name || user?.company }}</span>?
    This action cannot be undone.
  </p>

  <div class="flex justify-end gap-2">
    <p-button label="Cancel" severity="secondary" (click)="close()" />
    <p-button label="Delete" severity="danger" (click)="submit()" />
  </div>
</p-dialog>
