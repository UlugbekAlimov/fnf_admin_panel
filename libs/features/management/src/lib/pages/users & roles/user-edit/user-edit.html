<p-dialog
  [header]="mode === 'create' ? 'Create user' : 'Edit user'"
  [modal]="true"
  [(visible)]="visible"
  [style]="{ width: '32rem' }"
>
  <p class="text-sm text-slate-500 mb-4">
    {{ mode === 'create' ? 'Add a new user.' : 'Update user information.' }}
  </p>

  <div class="space-y-4">
    <div class="grid gap-4 md:grid-cols-2">
      <div class="space-y-2">
        <label class="block text-xs font-semibold text-slate-500">Name *</label>
        <input type="text" pInputText [(ngModel)]="editName" placeholder="User name" />
      </div>
      <div class="space-y-2">
        <label class="block text-xs font-semibold text-slate-500">Email</label>
        <input type="email" pInputText [(ngModel)]="editEmail" placeholder="user@email.com" />
      </div>
    </div>

    <div class="grid gap-4 md:grid-cols-2">
      <div class="space-y-2">
        <label class="block text-xs font-semibold text-slate-500">Role</label>
        <p-select
          [options]="roles"
          [(ngModel)]="editRole"
          optionLabel="name"
          placeholder="Select role"
        />
      </div>
      <div class="space-y-2">
        <label class="block text-xs font-semibold text-slate-500">Plan</label>
        <p-select
          [options]="plans"
          [(ngModel)]="editPlan"
          optionLabel="name"
          placeholder="Select plan"
        />
      </div>
    </div>

    <div class="grid gap-4 md:grid-cols-2">
      <div class="space-y-2">
        <label class="block text-xs font-semibold text-slate-500">Status</label>
        <p-select
          [options]="statuses"
          [(ngModel)]="editStatus"
          optionLabel="name"
          placeholder="Select status"
        />
      </div>
      <div class="space-y-2">
        <label class="block text-xs font-semibold text-slate-500">Users count</label>
        <input type="number" pInputText [(ngModel)]="editUsers" min="0" />
      </div>
    </div>
  </div>

  <div class="mt-6 flex justify-end gap-2">
    <p-button label="Cancel" severity="secondary" (click)="close()" />
    <p-button [label]="mode === 'create' ? 'Create' : 'Save'" (click)="submit()" />
  </div>
</p-dialog>
