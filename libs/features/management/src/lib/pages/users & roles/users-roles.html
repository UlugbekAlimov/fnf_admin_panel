<div>
  <div class="flex justify-between">
    <h1>Companies</h1>
    <p-button icon="pi pi-envelope" class="emerald-btn" label="Invite user" />
  </div>
  <div class="flex justify-between">
    <div class="mt-5 space-x-2">
      <input class="" pInputText [(ngModel)]="value2" type="text" placeholder="Search by Name" />
      <p-select icon="pi pi-upload" optionLabel="name" placeholder="Role"> </p-select>
      <p-select optionLabel="name" placeholder="All statuses" />
      <p-datepicker
        [(ngModel)]="dates"
        [showButtonBar]="true"
        placeholder="Customized"
        selectionMode="range"
        [readonlyInput]="true"
      >
        <ng-template #buttonbar let-todayCallback="todayCallback" let-clearCallback="clearCallback">
          <div class="flex justify-between w-full">
            <div class="flex gap-2">
              <p-button size="small" label="Exact" severity="secondary" />
              <p-button size="small" label="Flexible" severity="secondary" />
            </div>
            <div class="flex gap-2">
              <p-button
                size="small"
                label="Today"
                (click)="todayCallback($event)"
                variant="outlined"
              />
              <p-button
                size="small"
                icon="pi pi-times"
                severity="danger"
                variant="text"
                (click)="clearCallback($event)"
              />
            </div>
          </div>
        </ng-template>
      </p-datepicker>
    </div>
    <div class="mt-5">
        <p-select optionLabel="name" placeholder="Bulk actions" />
    </div>
  </div>
  <div class="mt-5">
    <ui-table
      [value]="products"
      [columns]="tableColumns"
      [totalRecords]="totalRecords"
      [rowsPerPageOptions]="rowsPerPageOptions"
      [showPhoto]="true"
      photoField="photo"
      photoAltField="company"
      photoHeader="Company"
      [chipFields]="chipFields"
      [chipVariantFieldMap]="chipVariantFieldMap"
      actionsHeader=""
    >
      <ng-template #actions let-row>
        <button #btn (click)="edit(row)"><i class="pi pi-ellipsis-v"></i></button>

        <p-contextmenu [target]="btn" appendTo="body" [model]="items" />
      </ng-template>
    </ui-table>
  </div>
</div>
