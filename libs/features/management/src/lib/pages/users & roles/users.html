<div>
  <div class="flex justify-between">
    <div class="mt-5 space-x-2">
      <input class="" pInputText [(ngModel)]="value2" type="text" placeholder="Search by Name" />
      <p-select icon="pi pi-upload" optionLabel="name" placeholder="Role"> </p-select>
      <p-select optionLabel="name" placeholder="All statuses" />
      <p-datepicker
        [(ngModel)]="dates"
        [showButtonBar]="true"
        placeholder="Customized"
        selectionMode="range"
        [readonlyInput]="true"
      >
        <ng-template #buttonbar let-todayCallback="todayCallback" let-clearCallback="clearCallback">
          <div class="flex justify-between w-full">
            <div class="flex gap-2">
              <p-button size="small" label="Exact" severity="secondary" />
              <p-button size="small" label="Flexible" severity="secondary" />
            </div>
            <div class="flex gap-2">
              <p-button
                size="small"
                label="Today"
                (click)="todayCallback($event)"
                variant="outlined"
              />
              <p-button
                size="small"
                icon="pi pi-times"
                severity="danger"
                variant="text"
                (click)="clearCallback($event)"
              />
            </div>
          </div>
        </ng-template>
      </p-datepicker>
    </div>
    <div class="mt-5">
        <div class="flex items-center gap-2">
          <p-select optionLabel="name" placeholder="Bulk actions" />
          <p-button class="emerald-btn" label="Add user" icon="pi pi-plus" (click)="openCreate()"></p-button>
        </div>
    </div>
  </div>
  <div class="mt-5">
    <ui-table
      [value]="products"
      [columns]="tableColumns"
      [totalRecords]="totalRecords"
      [rowsPerPageOptions]="rowsPerPageOptions"
      [showPhoto]="true"
      photoField="photo"
      photoAltField="company"
      photoHeader="Company"
      [chipFields]="chipFields"
      [chipVariantFieldMap]="chipVariantFieldMap"
      actionsHeader=""
    >
      <ng-template #actions let-row>
        <div class="flex items-center gap-2 justify-center">
          <button (click)="detail(row)"><i class="cursor-pointer text-green-500 pi pi-eye"></i></button>
          <button (click)="edit(row)"><i class="cursor-pointer text-amber-500 pi pi-pencil"></i></button>
          <button (click)="remove(row)"><i class="cursor-pointer text-red-500 pi pi-trash"></i></button>
        </div>
      </ng-template>
    </ui-table>
  </div>

  <user-edit
    [(visible)]="showEditDialog"
    [user]="selectedUser"
    mode="edit"
    (save)="updateUser($event)"
  ></user-edit>
  <user-edit
    [(visible)]="showCreateDialog"
    [user]="null"
    mode="create"
    (create)="createUser($event)"
  ></user-edit>
  <user-delete
    [(visible)]="showDeleteDialog"
    [user]="selectedUser"
    (confirm)="confirmDelete($event)"
  ></user-delete>
  <user-detail [(visible)]="showDetailDrawer" [user]="selectedUser"></user-detail>
</div>
