<div class="space-y-6">
  <div class="flex flex-wrap items-center justify-between gap-3">
    <div>
      <h1 class="text-2xl font-semibold text-slate-900">AI Settings</h1>
      <p class="text-sm text-slate-500">
        Configure providers, model behavior, and safety for AI features.
      </p>
    </div>
    <p-button label="Save Changes" class="emerald-btn" (onClick)="save()" />
  </div>

  <div class="rounded-2xl border border-slate-200 bg-white p-6 shadow-sm">
    <h2 class="text-sm font-semibold uppercase tracking-wide text-slate-400">Provider</h2>
    <div class="mt-4 grid gap-4 md:grid-cols-2">
      <div>
        <label class="mb-1 block text-xs font-semibold text-slate-500">Provider</label>
        <p-select
          class="w-full"
          [options]="providers"
          optionLabel="name"
          [(ngModel)]="selectedProvider"
        />
      </div>
      <div>
        <label class="mb-1 block text-xs font-semibold text-slate-500">Model</label>
        <p-select
          class="w-full"
          [options]="models"
          optionLabel="name"
          [(ngModel)]="selectedModel"
        />
      </div>
      <div>
        <label class="mb-1 block text-xs font-semibold text-slate-500">API Key</label>
        <input
          pInputText
          type="password"
          class="w-full"
          [(ngModel)]="apiKey"
          placeholder="sk-..."
        />
      </div>
      <div>
        <label class="mb-1 block text-xs font-semibold text-slate-500">Base URL</label>
        <input
          pInputText
          type="text"
          class="w-full"
          [(ngModel)]="baseUrl"
          placeholder="https://api.provider.com"
        />
      </div>
    </div>
  </div>

  <div class="rounded-2xl border border-slate-200 bg-white p-6 shadow-sm">
    <h2 class="text-sm font-semibold uppercase tracking-wide text-slate-400">Behavior</h2>
    <div class="mt-4 grid gap-4 md:grid-cols-2">
      <div>
        <label class="mb-1 block text-xs font-semibold text-slate-500">Tone</label>
        <p-select
          class="w-full"
          [options]="toneOptions"
          optionLabel="name"
          [(ngModel)]="selectedTone"
        />
      </div>
      <div>
        <label class="mb-1 block text-xs font-semibold text-slate-500">Max Tokens</label>
        <input pInputText type="number" class="w-full" [(ngModel)]="maxTokens" />
      </div>
      <div>
        <label class="mb-1 block text-xs font-semibold text-slate-500">Temperature</label>
        <input pInputText type="number" step="0.1" class="w-full" [(ngModel)]="temperature" />
      </div>
      <div>
        <label class="mb-1 block text-xs font-semibold text-slate-500">Top P</label>
        <input pInputText type="number" step="0.1" class="w-full" [(ngModel)]="topP" />
      </div>
      <div class="md:col-span-2">
        <label class="mb-1 block text-xs font-semibold text-slate-500">System Prompt</label>
        <textarea
          pInputTextarea
          rows="4"
          class="w-full"
          [(ngModel)]="systemPrompt"
          placeholder="Define the assistant behavior for your platform..."
        ></textarea>
      </div>
    </div>
  </div>

  <div class="rounded-2xl border border-slate-200 bg-white p-6 shadow-sm">
    <h2 class="text-sm font-semibold uppercase tracking-wide text-slate-400">Limits</h2>
    <div class="mt-4 grid gap-4 md:grid-cols-2">
      <div>
        <label class="mb-1 block text-xs font-semibold text-slate-500">Requests per minute</label>
        <input pInputText type="number" class="w-full" [(ngModel)]="requestsPerMinute" />
      </div>
      <div>
        <label class="mb-2 block text-xs font-semibold text-slate-500">Allow file tools</label>
        <label class="flex items-center gap-3 text-sm text-slate-600">
          <p-checkbox [(ngModel)]="allowFileTools" binary="true"></p-checkbox>
          <span>Enable file upload tools for AI workflows</span>
        </label>
      </div>
    </div>
  </div>

  <div class="rounded-2xl border border-slate-200 bg-white p-6 shadow-sm">
    <h2 class="text-sm font-semibold uppercase tracking-wide text-slate-400">Safety & Logs</h2>
    <div class="mt-4 grid gap-4 md:grid-cols-2">
      <label class="flex items-start gap-3 text-sm text-slate-600">
        <p-checkbox [(ngModel)]="enableModeration" binary="true"></p-checkbox>
        <span class="leading-5">
          Enable moderation filters
          <span class="mt-1 block text-xs text-slate-400">Block unsafe content in prompts and outputs.</span>
        </span>
      </label>
      <label class="flex items-start gap-3 text-sm text-slate-600">
        <p-checkbox [(ngModel)]="logPrompts" binary="true"></p-checkbox>
        <span class="leading-5">
          Store prompts and responses
          <span class="mt-1 block text-xs text-slate-400">
            Keep anonymized logs for troubleshooting and analytics.
          </span>
        </span>
      </label>
    </div>
  </div>
</div>
