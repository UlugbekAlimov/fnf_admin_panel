<p-dialog
  [header]="isEditMode ? 'Edit plan' : 'Add plan'"
  [modal]="true"
  [(visible)]="visible"
  (visibleChange)="handleVisibleChange($event)"
  [style]="{ width: '32rem' }"
>
  <div class="space-y-4">
    <div class="space-y-2">
      <label class="block text-xs font-semibold text-slate-500">Plan name *</label>
      <input class="w-full" type="text" pInputText [(ngModel)]="name" placeholder="Plan name" />
    </div>
    <div class="grid gap-4 sm:grid-cols-2">
      <div class="space-y-2">
        <label class="block text-xs font-semibold text-slate-500">Max users</label>
        <input class="w-full" type="number" pInputText [(ngModel)]="maxUsers" />
      </div>
      <div class="space-y-2">
        <label class="block text-xs font-semibold text-slate-500">Storage (MB)</label>
        <input class="w-full" type="number" pInputText [(ngModel)]="maxStorageMb" />
      </div>
      <div class="space-y-2">
        <label class="block text-xs font-semibold text-slate-500">Max courses</label>
        <input class="w-full" type="number" pInputText [(ngModel)]="maxCourses" />
      </div>
      <div class="space-y-2">
        <label class="block text-xs font-semibold text-slate-500">AI requests / month</label>
        <input class="w-full" type="number" pInputText [(ngModel)]="aiRequests" />
      </div>
      <div class="space-y-2">
        <label class="block text-xs font-semibold text-slate-500">Monthly ($)</label>
        <input class="w-full" type="number" pInputText [(ngModel)]="priceMonthly" />
      </div>
      <div class="space-y-2">
        <label class="block text-xs font-semibold text-slate-500">Yearly ($)</label>
        <input class="w-full" type="number" pInputText [(ngModel)]="priceYearly" />
      </div>
    </div>
    <label class="inline-flex items-center gap-2 text-sm text-slate-600">
      <input type="checkbox" class="h-4 w-4" [(ngModel)]="isActive" />
      Active plan
    </label>
  </div>

  <div class="mt-6 flex justify-end gap-2">
    <p-button label="Cancel" severity="secondary" (click)="close()"></p-button>
    <p-button
      [label]="isEditMode ? 'Save' : 'Add'"
      (click)="submit()"
      [disabled]="!name.trim()"
    ></p-button>
  </div>
</p-dialog>
