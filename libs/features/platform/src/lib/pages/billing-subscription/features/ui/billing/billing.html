<section class="flex w-full flex-col gap-6 mt-4">
  <div class="flex items-center justify-end gap-2">
    <p-button
      [icon]="store.loading() ? 'pi pi-spinner pi-spin' : 'pi pi-refresh'"
      class="emerald-btn"
      label="Refresh"
      [disabled]="store.loading()"
      (click)="refreshPlans()"
    ></p-button>
    <p-button
      icon="pi pi-plus"
      class="emerald-btn"
      label="Add plan"
      (click)="openCreatePlanDialog()"
    ></p-button>
  </div>
  <p-card>
    <ng-template pTemplate="title">Plans</ng-template>
    <ng-template pTemplate="content">
      <ui-table
        [value]="planRows"
        [columns]="planColumns"
        [chipFields]="['status']"
        [chipVariantFieldMap]="{ status: 'statusVariant' }"
        [selection]="selectedPlans"
        (selectionChange)="selectedPlans = $event"
        [loading]="store.loading()"
        [showPaginator]="false"
        [tableStyle]="{ 'min-width': '0' }"
        actionsHeader=""
        actionsColWidth="3.5rem"
      >
        <ng-template #actions let-row>
          <div class="flex items-center justify-center gap-2">
            <button type="button" (click)="openEditPlan(row); $event.stopPropagation()">
              <i class="cursor-pointer text-amber-500 pi pi-pencil"></i>
            </button>
            <button type="button" (click)="openDeletePlan(row); $event.stopPropagation()">
              <i class="cursor-pointer text-red-500 pi pi-trash"></i>
            </button>
          </div>
        </ng-template>
      </ui-table>
    </ng-template>
  </p-card>
</section>

<platform-billing-create
  [(visible)]="showCreatePlanDialog"
  [editingPlan]="editingPlan"
  (create)="addPlan($event)"
  (update)="updatePlan($event)"
>
</platform-billing-create>

<p-dialog
  header="Delete plan"
  [modal]="true"
  [(visible)]="showDeleteDialog"
  (onHide)="closeDeleteDialog()"
  [style]="{ width: '28rem' }"
>
  <p class="text-sm text-slate-500 mb-6">
    Delete <span class="font-semibold text-slate-900">{{ deletingPlanName || 'this plan' }}</span>?
    This action cannot be undone.
  </p>
  <div class="flex justify-end gap-2">
    <p-button label="Cancel" severity="secondary" (click)="closeDeleteDialog()"></p-button>
    <p-button label="Delete" severity="danger" (click)="deletePlan()"></p-button>
  </div>
</p-dialog>
