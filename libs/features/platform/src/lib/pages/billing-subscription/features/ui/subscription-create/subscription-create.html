<p-dialog
  header="Add subscriber"
  [modal]="true"
  [(visible)]="visible"
  [style]="{ width: '32rem' }"
>
  <div class="space-y-4">
    <div class="space-y-2">
      <label class="block text-xs font-semibold text-slate-500">Company ID *</label>
      <input class="w-full" type="text" pInputText [(ngModel)]="companyId" />
    </div>
    <div class="space-y-2">
      <label class="block text-xs font-semibold text-slate-500">Plan ID *</label>
      <input class="w-full" type="text" pInputText [(ngModel)]="planId" />
    </div>
    <div class="grid gap-4 sm:grid-cols-2">
      <div class="space-y-2">
        <label class="block text-xs font-semibold text-slate-500">Status</label>
        <input class="w-full" type="text" pInputText [(ngModel)]="status" />
      </div>
      <div class="space-y-2">
        <label class="block text-xs font-semibold text-slate-500">Billing cycle</label>
        <input class="w-full" type="text" pInputText [(ngModel)]="billingCycle" />
      </div>
      <div class="space-y-2">
        <label class="block text-xs font-semibold text-slate-500">Period start</label>
        <input class="w-full" type="text" pInputText [(ngModel)]="currentPeriodStart" />
      </div>
      <div class="space-y-2">
        <label class="block text-xs font-semibold text-slate-500">Period end</label>
        <input class="w-full" type="text" pInputText [(ngModel)]="currentPeriodEnd" />
      </div>
    </div>
  </div>

  <div class="mt-6 flex justify-end gap-2">
    <p-button label="Cancel" severity="secondary" (click)="close()"></p-button>
    <p-button label="Add" (click)="submit()" [disabled]="!companyId.trim() || !planId.trim()">
    </p-button>
  </div>
</p-dialog>
