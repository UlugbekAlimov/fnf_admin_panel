<div class="space-y-6">
  <div class="flex flex-wrap items-center justify-between gap-3">
    <div>
      <h1 class="text-2xl font-semibold text-slate-900">Notebook LLM</h1>
      <p class="text-sm text-slate-500">
        Manage notebooks, prompts, and shared knowledge used by your AI workflows.
      </p>
    </div>
    <div class="flex items-center gap-2">
      <p-button icon="pi pi-refresh" label="Refresh" severity="secondary" (onClick)="refresh()" />
      <p-button icon="pi pi-plus" class="emerald-btn" label="Create Notebook" (onClick)="openCreateNotebook()" />
    </div>
  </div>

  <div class="rounded-2xl border border-slate-200 bg-white p-5 shadow-sm">
    <div class="flex flex-wrap items-center gap-3">
      <div class="flex flex-1 items-center gap-2 rounded-lg border border-slate-200 bg-white px-3 py-2">
        <i class="pi pi-search text-slate-400"></i>
        <input
          pInputText
          type="text"
          class="w-full border-none bg-transparent text-sm text-slate-700 focus:outline-none"
          [(ngModel)]="search"
          placeholder="Search notebooks..."
        />
      </div>
      <p-select
        class="min-w-[160px]"
        [options]="visibilityOptions"
        optionLabel="name"
        [(ngModel)]="selectedVisibility"
      />
      <p-select
        class="min-w-[160px]"
        [options]="statusOptions"
        optionLabel="name"
        [(ngModel)]="selectedStatus"
      />
    </div>
  </div>

  <div class="rounded-2xl border border-slate-200 bg-white p-5 shadow-sm">
    <ui-table
      [value]="notebooks"
      [columns]="columns"
      [totalRecords]="notebooks.length"
      [rows]="10"
      [first]="0"
      [rowsPerPageOptions]="[10, 20, 30]"
      [loading]="false"
      [showIndex]="true"
      [chipFields]="chipFields"
      [chipVariantFieldMap]="chipVariantFieldMap"
      actionsHeader=""
      actionsColWidth="4rem"
    >
      <ng-template #actions let-row>
        <div class="flex items-center justify-center gap-2">
          <button type="button">
            <i class="pi pi-eye text-emerald-600"></i>
          </button>
          <button type="button" (click)="openEditNotebook(row)">
            <i class="pi pi-pencil text-amber-500"></i>
          </button>
          <button type="button" (click)="openDeleteNotebook(row)">
            <i class="pi pi-trash text-red-500"></i>
          </button>
        </div>
      </ng-template>
    </ui-table>
  </div>
</div>

<p-dialog
  [header]="isEditMode ? 'Edit notebook' : 'Create notebook'"
  [modal]="true"
  [(visible)]="showCreateDialog"
  (onHide)="handleCreateDialogHide($event)"
  [style]="{ width: '34rem' }"
>
  <div class="space-y-4">
    <div class="space-y-2">
      <label class="block text-xs font-semibold text-slate-500">Notebook name *</label>
      <input class="w-full" type="text" pInputText [(ngModel)]="formName" />
    </div>
    <div class="space-y-2">
      <label class="block text-xs font-semibold text-slate-500">Owner *</label>
      <input class="w-full" type="text" pInputText [(ngModel)]="formOwner" />
    </div>
    <div class="grid gap-4 sm:grid-cols-2">
      <div class="space-y-2">
        <label class="block text-xs font-semibold w-full text-slate-500">Status</label>
        <p-select [options]="formStatusOptions" optionLabel="name" [(ngModel)]="formStatus" />
      </div>
      <div class="space-y-2">
        <label class="block text-xs w-full font-semibold text-slate-500">Visibility</label>
        <p-select [options]="formVisibilityOptions" optionLabel="name" [(ngModel)]="formVisibility" />
      </div>
      <div class="space-y-2">
        <label class="block text-xs font-semibold text-slate-500">Tokens</label>
        <input class="w-full" type="number" min="0" pInputText [(ngModel)]="formTokens" />
      </div>
      <div class="space-y-2">
        <label class="block text-xs font-semibold text-slate-500">Last edited</label>
        <input class="w-full" type="date" pInputText [(ngModel)]="formLastEdited" />
      </div>
    </div>
  </div>

  <div class="mt-6 flex justify-end gap-2">
    <p-button label="Cancel" severity="secondary" (click)="handleCreateDialogHide(false)"></p-button>
    <p-button
      [label]="isEditMode ? 'Save' : 'Create'"
      (click)="submitNotebook()"
      [disabled]="!formName.trim() || !formOwner.trim()"
    ></p-button>
  </div>
</p-dialog>

<p-dialog
  header="Delete notebook"
  [modal]="true"
  [(visible)]="showDeleteDialog"
  (onHide)="closeDeleteDialog()"
  [style]="{ width: '28rem' }"
>
  <p class="text-sm text-slate-500 mb-6">
    Delete <span class="font-semibold text-slate-900">{{ deletingNotebookName || 'this notebook' }}</span>?
    This action cannot be undone.
  </p>
  <div class="flex justify-end gap-2">
    <p-button label="Cancel" severity="secondary" (click)="closeDeleteDialog()"></p-button>
    <p-button label="Delete" severity="danger" (click)="deleteNotebook()"></p-button>
  </div>
</p-dialog>
