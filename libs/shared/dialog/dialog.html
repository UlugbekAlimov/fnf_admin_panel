<div class="card flex justify-center z-1000">
  <p-dialog
    header="{{ title }}"
    [modal]="true"
    [(visible)]="visible"
    [style]="dialogStyle"
    (onHide)="setVisible(false)"
  >
    <span class="p-text-secondary block mb-6">{{ description }}</span>

    <div class="space-y-6">
      <div>
        <p class="text-xs font-semibold uppercase tracking-[0.18em] text-slate-400 mb-3">
          Basic information
        </p>
        <div class="grid gap-4 md:grid-cols-2">
          <div class="space-y-2">
            <label class="text-xs font-semibold text-slate-500">Name *</label>
            <input type="text" pInputText [(ngModel)]="name" placeholder="Company name" />
          </div>
          <div class="space-y-2">
            <label class="text-xs font-semibold text-slate-500">Slug *</label>
            <input type="text" pInputText [(ngModel)]="slug" placeholder="company-slug" />
          </div>
          <div class="space-y-2">
            <label class="text-xs font-semibold text-slate-500">Legal name</label>
            <input type="text" pInputText [(ngModel)]="legalName" placeholder="Legal entity name" />
          </div>
          <div class="space-y-2">
            <label class="text-xs font-semibold text-slate-500">Country</label>
            <p-select
              [options]="countries"
              [(ngModel)]="country"
              optionLabel="name"
              placeholder="Select a Country"
              class="w-full"
            />
          </div>
          <div class="space-y-2">
            <label class="text-xs font-semibold text-slate-500">Timezone</label>
            <input type="text" pInputText [(ngModel)]="timezone" placeholder="Asia/Dushanbe" />
          </div>
          <div class="space-y-2">
            <label class="text-xs font-semibold text-slate-500">Default locale</label>
            <input type="text" pInputText [(ngModel)]="locale" placeholder="en" />
          </div>
        </div>
      </div>

      <div>
        <p class="text-xs font-semibold uppercase tracking-[0.18em] text-slate-400 mb-3">
          Branding
        </p>
        <div class="grid gap-4 md:grid-cols-2">
          <div class="space-y-2">
            <label class="text-xs font-semibold text-slate-500">Logo URL</label>
            <input type="text" pInputText [(ngModel)]="logoUrl" placeholder="https://..." />
          </div>
          <div class="space-y-2">
            <label class="text-xs font-semibold text-slate-500">Primary color</label>
            <div class="flex items-center gap-3">
              <p-colorpicker [(ngModel)]="primaryColor" inputId="cp-primary" />
              <span class="text-sm text-slate-600">{{ primaryColor }}</span>
            </div>
          </div>
          <div class="space-y-2">
            <label class="text-xs font-semibold text-slate-500">Secondary color</label>
            <div class="flex items-center gap-3">
              <p-colorpicker [(ngModel)]="secondaryColor" inputId="cp-secondary" />
              <span class="text-sm text-slate-600">{{ secondaryColor }}</span>
            </div>
          </div>
        </div>
      </div>

      <div>
        <p class="text-xs font-semibold uppercase tracking-[0.18em] text-slate-400 mb-3">Status</p>
        <p-select
          [options]="statuses"
          [(ngModel)]="status"
          optionLabel="name"
          placeholder="Select status"
          class="w-full md:w-56"
        />
      </div>
    </div>

    <div class="mt-8 flex justify-end gap-2">
      <p-button label="Cancel" severity="secondary" (click)="setVisible(false)" />
      <p-button label="{{ btn_title }}" (click)="confirm()" />
    </div>
  </p-dialog>
</div>
