<div class="card">
  <p-table [value]="value" [tableStyle]="tableStyle" [loading]="loading">
    <ng-template #header>
      <tr>
        <th></th>
        <th *ngIf="showIndex">{{ indexHeader }}</th>
        <th *ngIf="showPhoto">{{ photoHeader }}</th>
        <th *ngFor="let col of columns">{{ col.header }}</th>
        <th *ngIf="chipTemplate">{{ chipHeader }}</th>
        <th *ngIf="actionsTemplate" [style.width]="actionsColWidth">{{ actionsHeader }}</th>
      </tr>
    </ng-template>
    <ng-template #body let-row let-rowIndex="rowIndex">
      <tr>
        <td>
          <p-tableCheckbox />
        </td>
        <td *ngIf="showIndex">{{ rowIndex + 1 + first }}</td>
        <td *ngIf="showPhoto">
          <img [src]="row[photoField]" [alt]="row[photoAltField] || ''" [class]="photoClass" />
        </td>
        <td *ngFor="let col of columns">
          <ng-container *ngIf="isChipField(col.field); else textCell">
            <ui-chip
              [variant]="row[getChipVariantField(col.field)]"
              [icon]="row[getChipIconField(col.field)]"
            >
              {{ row[col.field] }}
            </ui-chip>
          </ng-container>
          <ng-template #textCell>
            <div class="flex flex-col gap-1">
              <span>{{ row[col.field] }}</span>
              <ng-container *ngIf="getSubTextField(col.field) as subField">
                <span [class]="subTextClass">{{ row[subField] }}</span>
              </ng-container>
            </div>
          </ng-template>
        </td>
        <td *ngIf="chipTemplate">
          <ng-container
            *ngTemplateOutlet="chipTemplate; context: { $implicit: row }"
          ></ng-container>
        </td>
        <td *ngIf="actionsTemplate" [style.width]="actionsColWidth">
          <ng-container
            *ngTemplateOutlet="actionsTemplate; context: { $implicit: row }"
          ></ng-container>
        </td>
      </tr>
    </ng-template>
    <ng-template #emptymessage>
      <tr>
        <td [attr.colspan]="totalColumns">{{ emptyMessage }}</td>
      </tr>
    </ng-template>
  </p-table>
  <p-paginator
    *ngIf="showPaginator"
    (onPageChange)="handlePageChange($event)"
    [first]="first"
    [rows]="rows"
    [totalRecords]="totalRecords"
    [rowsPerPageOptions]="rowsPerPageOptions"
    styleClass="ui-table-paginator-sticky"
  />
</div>
